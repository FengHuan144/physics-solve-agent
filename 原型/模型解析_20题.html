<style>
:root{
  --paper:#fbfaf7; --side:#f4f1ea; --ink:#1c1c1a; --ink2:#4a4844; --ink3:#8b8680;
  --line:#e2ded5; --line2:#d0cbc0; --red:#a5322b; --accent:#2f5d8a;
  --hl:#fdf7ea; --hlb:#f0e6cf;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

button{font-family:inherit;cursor:pointer}

#top{

  padding:9px 18px; background:rgba(251,250,247,.94);
  border-bottom:1px solid var(--line); backdrop-filter:blur(6px);
}
#qbtn{
  border:1px solid var(--line2); background:#fff; border-radius:6px;
  padding:5px 11px; font-size:13px; color:var(--ink2);
}
#qbtn:hover{border-color:var(--ink3)}
#qtitle{font-size:14px; color:var(--ink2); letter-spacing:.02em}

.spacer{flex:1}
#score{font-size:12.5px; color:var(--ink2); font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:9px}
#score .cov{font-size:13px}
#score .cov b{font-size:15px; color:var(--ink); font-weight:600}
#score .sc{font-size:11.5px; color:var(--ink3)}
#score .sc b{color:var(--ink2); font-weight:500}

#legend{
  display:flex; flex-wrap:wrap; gap:18px; align-items:center;
  padding:6px 18px; font-size:11.5px; color:var(--ink3);
  background:#fbfbfa; border-bottom:1px solid var(--line);
}
#legend .lg{display:inline-flex; align-items:center; gap:5px}
#legend .mk{font-family:ui-monospace,monospace; font-size:11px; padding:0 4px; border-radius:2px}
#legend .mk.ok{color:#2c6b46; background:#eff7f1; border:1px solid #bcd8c6}
#legend .mk.bad{color:var(--red); background:#fbf1f0; border:1px solid #e2bdb9}
#legend .mk.none{color:var(--ink3); border:1px solid var(--line2)}
#legend .lgsep{width:1px; height:12px; background:var(--line2)}
#legend #lg-stat{color:var(--ink2); font-weight:500}

#ptable{margin:0 0 14px; border:1px solid var(--line); border-radius:4px; background:#fdfdfc}
#ptable summary{cursor:pointer; font-size:13px; color:var(--ink2); list-style:none;
  display:flex; align-items:baseline; gap:8px; outline:none; padding:9px 13px}
#ptable summary::-webkit-details-marker{display:none}
#ptable summary::before{content:'▸'; color:var(--ink3); font-size:10px; transition:transform .15s}
#ptable[open] summary::before{transform:rotate(90deg)}
#ptable[open] summary{border-bottom:1px solid var(--line)}
#ptable summary .tag{font-size:11.5px; color:var(--ink3)}
.pt-hint{font-size:11.5px; color:var(--ink3); font-weight:400}
.pt-row{display:grid; grid-template-columns:56px 46px 40px 1fr; gap:8px; align-items:baseline;
  padding:5px 13px; font-size:12px; line-height:1.6; border-top:1px dotted var(--line)}
.pt-row:last-child{border-bottom:0; border-radius:0 0 4px 4px}
.pt-id{font-family:ui-monospace,monospace; font-size:11px; color:var(--ink3)}
.pt-st{font-size:11px; font-weight:500}
.pt-row.hit .pt-st{color:#2c6b46}
.pt-row.na  .pt-st{color:var(--ink3)}
.pt-row.miss .pt-st{color:var(--red)}
.pt-sc{font-size:11px; color:var(--ink3); text-align:right; font-variant-numeric:tabular-nums}
.pt-why{color:var(--ink2); font-size:12px}
.pt-by{display:inline-block; margin-right:6px; padding:0 4px; border-radius:2px;
  background:#f2f1ee; color:var(--ink3); font-size:10.5px; font-family:ui-monospace,monospace}

.step-score{white-space:nowrap}
.score-sub{font-size:11.5px; color:var(--ink3); margin-left:6px; letter-spacing:.01em}
#layers{display:flex; gap:4px}
.badge{
  font-size:10.5px; font-family:ui-monospace,monospace; padding:1px 5px;
  border-radius:3px; border:1px solid var(--line2); color:var(--ink3);
}
.badge.pass{color:#2c6b46; border-color:#bcd8c6; background:#eff7f1}
.badge.fail{color:var(--red); border-color:#e2bdb9; background:#fbf1f0}
.badge.na,.badge.skipped{color:var(--ink3)}

#banner{
  padding:7px 18px; font-size:12.5px; line-height:1.65;
  background:#fdf7ea; color:#6d5818; border-bottom:1px solid #f0e6cf;
}
#banner b{font-weight:500; color:#4d3d0d}
#mode{font-size:11.5px; color:var(--ink3); border:1px dashed var(--line2); padding:1px 7px; border-radius:3px}

#runbar{
  padding:6px 18px; font-size:11.5px; line-height:1.7; color:var(--ink2);
  background:#f5f5f2; border-bottom:1px solid var(--line);
  font-family:var(--font-sans,"PingFang SC",sans-serif);
}
#runbar[hidden]{display:none}
#runbar .k{color:var(--ink3); margin-right:4px}
#runbar .sep{color:var(--ink3); margin:0 8px}
#runbar b{font-weight:500; color:var(--ink)}
#runbar .warn{color:#8a5a10}

#qlist{
  position:absolute; top:44px; left:18px; z-index:40; background:#fff;
  border:1px solid var(--line2); border-radius:8px; padding:5px; min-width:280px;
  box-shadow:0 6px 24px rgba(0,0,0,.09); max-height:70vh; overflow:auto;
}
.qitem{
  display:block; width:100%; text-align:left; border:0; background:none;
  padding:7px 11px; border-radius:5px; font-size:13px; color:var(--ink2);
}
.qitem:hover{background:var(--side)}
.qitem.active{background:var(--hl); color:var(--ink); font-weight:500}
.qitem b{font-family:ui-monospace,monospace; font-weight:500; margin-right:8px}

#main{display:flex; align-items:flex-start; max-width:1400px; margin:0 auto}

#side{
  width:400px; flex:0 0 400px; padding:26px 22px 60px 26px;
  border-right:1px solid var(--line); position:sticky; top:44px;
  max-height:calc(100vh - 44px); overflow-y:auto;
  font-size:14px; line-height:1.8;
}
#stem{color:var(--ink); text-align:justify}
/* 新题专用：题干/小问/分值不是题面原文时，就地标注，别让人以为是原卷 */
#stemnote .sn{
  display:block; margin-top:10px; padding:7px 10px;
  border-left:2px solid var(--line2); background:#f7f5ef;
  font-size:11.5px; line-height:1.65; color:var(--ink2); text-align:left;
}
.sec{
  margin:26px 0 10px; font-size:11.5px; letter-spacing:.22em; color:var(--ink3);
  border-bottom:1px solid var(--line); padding-bottom:6px;
}
#figures{margin-top:18px}
.fig{margin:0 0 16px}
.fig img{max-width:100%; display:block; border:1px solid var(--line); border-radius:4px; background:#fff}
.fig-missing{
  border:1px dashed var(--line2); border-radius:4px; padding:22px 12px; text-align:center;
  color:var(--ink3); font-size:12px; background:#fdfcfa;
}
.fig-missing .tag{font-size:13px; letter-spacing:.12em; margin-bottom:4px}
.fig-cap{margin-top:7px; font-size:12px; line-height:1.65; color:var(--ink3)}
.fig-cap .no{color:var(--ink2); margin-right:6px; font-weight:500}
.fig-none{margin:0 0 14px; padding:8px 10px; border-left:2px solid var(--line2); background:#faf9f5}
.fig-none .fig-cap{margin-top:0}

.given{display:flex; gap:9px; padding:5px 0; border-bottom:1px dotted var(--line); font-size:13.5px}
.given:last-child{border-bottom:0}
.given .k{flex:0 0 auto; font-family:ui-monospace,monospace; color:var(--accent); font-size:13px; padding-top:2px}
.given .v{color:var(--ink2); line-height:1.7}
.given .src{
  display:inline-block; font-size:10.5px; color:#8a6a2f; background:#fbf4e2;
  border:1px solid #ecdcb4; border-radius:3px; padding:0 4px; margin-left:5px;
  vertical-align:1px; font-family:var(--font-sans,"PingFang SC",sans-serif);
}

.subq{display:flex; gap:9px; padding:7px 0; font-size:14px; border-bottom:1px dotted var(--line)}
.subq:last-child{border-bottom:0}
.subq .no{color:var(--accent); flex:0 0 auto}
.subq .tx{flex:1; color:var(--ink2)}
.subq .sc{flex:0 0 auto; color:var(--red); font-size:12.5px; align-self:flex-start; padding-top:3px}

#paper{flex:1; min-width:0; padding:26px 40px 90px 40px}
#plan{
  border:1px solid var(--line); border-radius:6px; background:#fdfcf9;
  padding:0; margin-bottom:30px; overflow:hidden;
}
#plan summary{
  cursor:pointer; padding:11px 16px; font-size:13px; color:var(--ink2); list-style:none;
  letter-spacing:.04em;
}
#plan summary::-webkit-details-marker{display:none}
#plan summary::before{content:"▸"; margin-right:8px; color:var(--ink3); display:inline-block; transition:transform .15s}
#plan[open] summary::before{transform:rotate(90deg)}
#plan summary .tag{margin-left:8px; color:var(--ink3); font-size:11.5px}
.plan-body{padding:0 16px 14px 16px; border-top:1px solid var(--line)}
.plan-row{
  display:flex; gap:10px; align-items:baseline; padding:5px 0;
  border-bottom:1px dotted var(--line); font-size:13px;
}
.plan-row:last-child{border-bottom:0}
.plan-row .n{font-family:ui-monospace,monospace; color:var(--ink3); font-size:12px; flex:0 0 26px}
.plan-row .t{flex:1; color:var(--ink2)}
.plan-row a{color:var(--ink2); text-decoration:none}
.plan-row a:hover{color:var(--accent); text-decoration:underline}
.plan-row .dep{font-size:11px; color:var(--ink3); flex:0 0 auto}
.plan-row .sc{font-size:12px; color:var(--red); flex:0 0 34px; text-align:right}

.paper-head{
  display:flex; align-items:baseline; gap:12px; margin-bottom:6px;
  padding-bottom:10px; border-bottom:2px solid var(--ink);
}
.paper-head .h{font-size:15px; letter-spacing:.3em; font-weight:500}
.paper-head .note{font-size:12px; color:var(--ink3); margin-left:auto}

.step{
  position:relative; padding:22px 0 22px 46px;
  border-bottom:1px solid var(--line);
}
.step:last-child{border-bottom:0}
.step::before{
  content:""; position:absolute; left:15px; top:26px; bottom:0; width:1px; background:var(--line);
}
.step:last-child::before{display:none}
.step-no{
  position:absolute; left:0; top:20px; width:31px; text-align:center;
  font-family:ui-monospace,monospace; font-size:12px; color:var(--ink3);
  background:var(--paper); line-height:20px;
}
.step-head{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.step-title{font-size:16px; font-weight:500; color:var(--ink); letter-spacing:.01em; line-height:1.5}
.step-score{
  margin-left:auto; font-size:12.5px; color:var(--red); flex:0 0 auto;
  font-variant-numeric:tabular-nums;
}
.step-score span{color:var(--ink3); font-size:11px}
.step-score.hit{color:#2f6b4f}
.step-score.part{color:#8a6a1f}
.step-score.na{color:var(--ink3)}
.step-score.miss{color:var(--red)}
.kind{
  font-size:10.5px; color:var(--ink3); border:1px solid var(--line2); border-radius:3px;

}
.laws{display:flex; gap:5px; flex-wrap:wrap; margin-top:5px}
.law{

  border-radius:3px; padding:0 6px; font-family:var(--font-sans,"PingFang SC",sans-serif);
  cursor:help;
}
.stmt{margin-top:9px; color:var(--ink); text-align:justify; line-height:1.85}

.eqbox{
  margin:12px 0 12px 2px; padding:10px 16px; background:var(--hl);
  border-left:2px solid var(--hlb); border-radius:0 4px 4px 0;
}
.eq{
  font-family:"Latin Modern Math","Cambria Math",Georgia,serif;
  font-size:17.5px; letter-spacing:.02em; color:#1a1a18; line-height:1.9;
}
.eq .raw{

.eqbox:hover .raw{display:block}
.value{
  margin:8px 0 0 2px; font-size:16px; color:var(--ink);

}
.value .arrow{color:var(--ink3); margin-right:7px; font-size:13px}
.value .tag-sym{
  font-family:var(--font-sans,"PingFang SC",sans-serif); font-size:10.5px; color:var(--ink3);
  border:1px solid var(--line2); border-radius:3px; padding:0 4px; margin-left:7px; vertical-align:2px;
}
.value .dir{font-size:12.5px; color:var(--ink3); margin-left:6px}

.why{
  margin-top:12px; padding:9px 14px; border-radius:4px;
  background:#f7f5f0; border-left:2px solid var(--line2);
  font-size:13.5px; line-height:1.75; color:var(--ink2);
  font-family:var(--font-sans,"PingFang SC","Microsoft YaHei",sans-serif);
}
.why .lb{
  display:block; font-size:10.5px; letter-spacing:.16em; color:var(--ink3); margin-bottom:3px;
}
.why.trap{background:#fdf1ef; border-left-color:#d9a7a1}
.why.trap .lb{color:var(--red)}
.why.trap .tx{color:#6d3029}

.chkrec{
  margin-top:10px; font-family:var(--font-sans,"PingFang SC",sans-serif);
  font-size:11.5px; color:var(--ink3);
}
.chkrec summary{
  cursor:pointer; list-style:none; display:inline-block; letter-spacing:.06em;
  border-bottom:1px dotted var(--line2);
}
.chkrec summary::-webkit-details-marker{display:none}
.chkrec summary::before{content:"▸ "; color:var(--line2)}
.chkrec[open] summary::before{content:"▾ "}
.chkrec .cl{
  display:flex; gap:8px; padding:5px 0 5px 2px; line-height:1.7;
  border-bottom:1px dotted var(--line);
}
.chkrec .cl:last-child{border-bottom:0}
.chkrec .cl b{flex:0 0 22px; font-weight:500; font-family:ui-monospace,monospace; font-size:11px}
.chkrec .cl b.pass{color:#2c6b46}
.chkrec .cl b.fail{color:var(--red)}
.chkrec .cl span{flex:1; color:var(--ink2)}

.chkrec.chk-na{color:var(--ink3)}
.chkrec.chk-na span{color:var(--ink3); font-style:normal}

.empty{padding:60px 0; color:var(--ink3); font-size:14px; text-align:center}
.foot{
  margin-top:36px; padding-top:14px; border-top:1px solid var(--line);
  font-size:11.5px; color:var(--ink3); line-height:1.9;
  font-family:var(--font-sans,"PingFang SC",sans-serif);
}

@media (max-width:1080px){
  #main{display:block}
  #side{
    width:auto; position:static; max-height:none; border-right:0;
    border-bottom:1px solid var(--line); padding:20px 20px 24px;
  }
  #paper{padding:22px 20px 70px}
  .step{padding-left:34px}
}
</style>
</head>

    .replace(/\bvb\b/g, 'v_b').replace(/\bvP\b/g, 'v_P').replace(/\bvMa\b/g, 'v_Ma')
    .replace(/\bDeltaE\b/g, 'ΔE')
    .replace(/\bm0\b/g, 'm₀').replace(/\bm1\b/g, 'm₁').replace(/\bm2\b/g, 'm₂')
    .replace(/\bVn1\b/g, 'Vₙ₊₁').replace(/\bun1\b/g, 'uₙ₊₁')
    .replace(/_0\b/g, '₀').replace(/_1\b/g, '₁').replace(/_2\b/g, '₂');
}

/* 把采分点依据里的白名单 id 换回模型写的符号（Nf→N、Gc→G、Iimp→I…）。
   映射由 _build_model.build_display 逐题从原始产物对齐得到，不在这里猜。 */
function mapBasis(a, txt, sid) {
  var m = (a.symbols && a.symbols.maps && a.symbols.maps[sid]) || null;
  if (!m) return txt;
  var keys = Object.keys(m).sort(function (x, y) { return y.length - x.length; });
  if (!keys.length) return txt;
  var re = new RegExp('(?<![A-Za-z0-9_])(?:' + keys.map(function (k) {
    return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

}
function num(v) { return v == null ? '' : String(v); }
/* 物理量按 3 位有效数字显示。原值挂在 title 上，可核对。
   原来直接 String(float)，A-09 会出现 9.486832980505138 这种 15 位小数。 */
function fmtNum(v) {
  if (v == null || v === '') return '';
  var n = Number(v);
  if (!isFinite(n)) return String(v);
  if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
  var a = Math.abs(n);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) return n.toExponential(2).replace('e', '×10^');
  var t = n.toPrecision(3);
  return String(parseFloat(t));
}
function numHTML(v) {
  var t = fmtNum(v), raw = num(v);
  if (t === raw) return esc(t);
  return '<span title="原始值 ' + esc(raw) + '">' + esc(t) + '</span>';
}
function unitText(u) {
  if (!u || u === '1') return '';
  return ' ' + String(u)
    .replace(/\^2/g, '²').replace(/\^3/g, '³')
    .replace(/\bohm\b/g, 'Ω').replace(/\bdeg\b/g, '°');
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }

/* ---------- 重复度：判断两段话是不是在说同一件事 ---------- */
function gram(s) {
  var t = String(s || '').replace(/[\s，。；：、（）()《》「」【】,.;:=+\-−·×÷/]/g, '');
  var o = Object.create(null), n = 0;
  for (var i = 0; i < t.length - 1; i++) { o[t.substr(i, 2)] = 1; n++; }
  return { set: o, n: n };
}
function similar(a, b) {
  if (!a || !b) return 0;
  var A = gram(a), B = gram(b);

  /* 用「包含度」而不是 Jaccard：一段话是另一段的子集时，Jaccard 会被长度稀释，
     导致明明重复的判据还是被显示出来。取 min 分母，子集情形直接判为重。 */
  var m = Math.min(A.n, B.n);
  return m <= 0 ? 0 : inter / m;
}

/* ================= 式子美化（与工作台同源，纯显示层） ================= */
function matchParen(s, i) {
  var d = 0;
  for (var j = i; j < s.length; j++) {
    if (s[j] === '(') d++;
    else if (s[j] === ')') { d--; if (d === 0) return j; }
  }
  return -1;
}
function isWrapped(s) { return s.charAt(0) === '(' && matchParen(s, 0) === s.length - 1; }

function splitTop(expr) {
  var s = String(expr).trim(), out = [], depth = 0, start = 0, sign = 1;
  for (var i = 0; i < s.length; i++) {
    var c = s[i];
    if (c === '(') depth++;
    else if (c === ')') depth--;
    else if (depth === 0 && (c === '+' || c === '-')) {
      if (i === 0) { sign = (c === '-') ? -1 : 1; start = 1; }
      else {
        var t = s.slice(start, i).trim();
        if (t) out.push({ sign: sign, term: t });
        sign = (c === '-') ? -1 : 1;
        start = i + 1;
      }
    }
  }
  var last = s.slice(start).trim();
  if (last) out.push({ sign: sign, term: last });
  return out;
}
function splitFactors(term) {
  var s = term, depth = 0, start = 0, parts = [], ops = [];
  for (var i = 0; i < s.length; i++) {
    var c = s[i];
    if (c === '(') depth++;
    else if (c === ')') depth--;
    else if (depth === 0 && c === '*' && s[i + 1] === '*') { i++; }
    else if (depth === 0 && (c === '*' || c === '/')) {
      parts.push(s.slice(start, i)); ops.push(c); start = i + 1;
    }
  }
  parts.push(s.slice(start));
  return { parts: parts, ops: ops };
}
var SUP = {
  '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸',
  '1/2': '½', '1/3': '⅓', '2/3': '⅔', '-1': '⁻¹', '-2': '⁻²'
};
function renderFactor(f) {
  var t = f.trim();
  if (!t) return { text: '', kind: 'atom' };
  var m = t.match(/^Rational\(\s*(-?\d+)\s*,\s*(-?\d+)\s*\)$/);
  if (m) return { text: m[1] + '/' + m[2], kind: 'compound' };
  if (isWrapped(t)) return { text: '(' + renderExpr(t.slice(1, -1)) + ')', kind: 'compound' };
  var pi = t.indexOf('**');
  if (pi > 0) {
    var base = t.slice(0, pi).trim(), exp = t.slice(pi + 2).trim(), bt;
    bt = isWrapped(base) ? '(' + renderExpr(base.slice(1, -1)) + ')' : sym(base);
    var key = exp.replace(/[()\s]/g, '');
    var su = SUP[key];
    if (su) return { text: bt + su, kind: 'atom' };
    return { text: bt + '^' + key, kind: 'compound' };
  }
  if (/^-?\d+(\.\d+)?$/.test(t)) return { text: t, kind: 'num' };
  if (/[\s]/.test(t) && /[+\-]/.test(t)) return { text: '(' + renderExpr(t) + ')', kind: 'compound' };
  return { text: sym(t), kind: 'atom' };
}
function renderTerm(term) {
  var sf = splitFactors(term), items = sf.parts.map(renderFactor);
  if (!items.length) return '';
  var out = items[0].text;
  if (items.length > 1 && items[0].kind === 'compound' && items[0].text.charAt(0) !== '(') out = '(' + out + ')';
  for (var i = 1; i < items.length; i++) {
    var op = sf.ops[i - 1], prev = items[i - 1], now = items[i];
    if (op === '/') {
      out += '/' + (now.kind === 'compound' && now.text.charAt(0) !== '(' ? '(' + now.text + ')' : now.text);
    } else {
      /* 乘法：数字在前且后接原子 → 连写；两个短原子相乘也连写（m·g → mg、m·v² → mv²）；
         其余（长因子、复合式）仍用间隔点，避免看成两个符号的乘积歧义 */
      var joinNum = prev.kind === 'num' && now.kind === 'atom' && /^[A-Za-zμΔ]/.test(now.text);
      var joinBare = prev.kind === 'atom' && now.kind === 'atom' &&
        prev.text.length <= 2 && now.text.length <= 2 &&
        /^[A-Za-zμΔ]/.test(prev.text) && /^[A-Za-zμΔ]/.test(now.text);
      if (joinNum || joinBare) out += now.text;

  }

}
function renderExpr(expr) {
  var terms = splitTop(expr), buf = '';
  for (var i = 0; i < terms.length; i++) {
    var s = renderTerm(terms[i].term);
    if (i === 0) buf += (terms[i].sign < 0 ? '−' : '') + s;
    else buf += (terms[i].sign < 0 ? ' − ' : ' + ') + s;

}
function prettify(sympy) {
  var raw = String(sympy || '').trim();
  if (!raw) return null;
  var terms;
  try { terms = splitTop(raw); } catch (e) { return { shown: raw, raw: raw }; }
  if (!terms.length) return { shown: raw, raw: raw };
  var pos = [], neg = [];
  for (var i = 0; i < terms.length; i++) {
    var sg = terms[i].sign, tm = terms[i].term;
    var m0 = tm.match(/^\(\s*0\s*-\s*([\s\S]+)\)$/);
    if (m0) { tm = m0[1]; sg = -sg; }
    (sg > 0 ? pos : neg).push(tm);
  }
  var L = pos.map(renderTerm).join(' + '), R = neg.map(renderTerm).join(' + '), out;
  if (!pos.length) out = '0 = ' + R;
  else if (!neg.length) out = (pos.length === 1) ? (L + ' = 0') : L;
  else out = L + ' = ' + R;
  if (/\*|Rational\(|sqrt\(|Piecewise/.test(out)) out = raw;
  return { shown: out, raw: raw };
}

  var out;
  try { out = renderExpr(raw); } catch (e) { out = raw; }
  if (/\*|Rational\(|sqrt\(|Piecewise/.test(out)) out = raw;
  return { shown: out, raw: raw };
}
function needsRaw(raw, shown) {
  return String(raw).replace(/\s+/g, '') !== String(shown).replace(/\s+/g, '');
}

/* ================= 渲染 ================= */
function hitMap(a) {
  var m = {};
  var hits = (a.grading && a.grading.point_hits) || [];
  for (var i = 0; i < hits.length; i++) m[hits[i].step_id] = hits[i];
  return m;
}

var KIND_NAME = {
  equation: '方程步', value: '结果步', judgment: '判断步',
  critical: '临界步', discussion: '讨论步'
};

function renderTop(a) {
  var m = a.meta || {};
  $('qtitle').innerHTML = '<b>' + esc(m.answer_id) + '</b> · ' +
    esc(m.source || '') + (m.question_no != null ? ' 第' + m.question_no + '题' : '');

  /* 讲题场景：主位放「判了几个点」，分数降为小字。
     原来把「9/14 分」做成大号红字，用户第一眼读成「模型只对了六成」，
     实际 14 分里 3 分从来没人判过（na），不是丢分。 */
  var g = a.grading || {};
  var sm = g.summary || {};
  var tot = sm.total, judged = (sm.total || 0) - (sm.na || 0);
  if (sm.hit != null && tot) {
    var cov;
    if (judged === 0) {
      cov = '<span class="cov" title="' + tot + ' 个采分点没有一个能判——不是模型全错">' +
            '<b>' + tot + '</b> 个采分点全部判不了</span>';
    } else {
      cov = '<span class="cov" title="共 ' + tot + ' 个采分点：命中 ' + sm.hit +
            '、判错 ' + (sm.miss || 0) + '、判不了 ' + (sm.na || 0) + '">' +
            '判了 <b>' + judged + '</b>/' + tot + ' 点</span>';
    }
    $('score').innerHTML = cov +
      '<span class="sc" title="只按能判的点计分；判不了的点不扣分也不给分">' +
        '<b>' + num(g.score_awarded) + '</b>/' + num(g.score_total) + ' 分</span>';
  } else if (m.mode === 'zero') {
    /* 题库外新题：没有人工采分点。不显示 0/14 这种数，那会被读成「全错」。 */
    $('score').innerHTML = '<span class="cov" title="题库外新题：无金标、无采分点，只出解析与自洽检查">' +
      '<b>未判分</b> · 题库外新题</span>';
  } else {
    $('score').innerHTML = '<span class="sc">' + num(g.score_awarded) + '/' + num(g.score_total) + ' 分</span>';
  }

  $('mode').textContent = m.mode === 'gold' ? '金标参考解'
    : (m.mode === 'zero' ? '题库外新题' : '模型输出');
}

/* 新题：题干/小问/分值的来源标注。题库内的题没有 _display，这里什么都不显示。 */
function renderStemNote(a) {
  var d = a._display || {}, bits = [];
  if (d.stem_source === 'model_ocr') bits.push('题干由<b>题图转写</b>（模型读图，不是你贴的原文）');
  if (d.scores_printed === false) bits.push('分值<b>非题面所印</b>，按模型分配显示');
  if (d.sub_text_from === 'model_ocr' && d.stem_source !== 'model_ocr') bits.push('小问文本取自题图转写');
  var el = $('stemnote');
  if (!el) return;
  el.innerHTML = bits.length ? ('<span class="sn">' + bits.join('；') + '</span>') : '';
}
function renderSidebar(a) {
  var q = a.question || {};
  $('stem').innerHTML = esc(String(q.stem_text || '').trim()).replace(/\n/g, '<br>');
  renderStemNote(a);

  var figs = q.figures || [], imgMap = IMAGES[cur] || {};
  if (!figs.length) {
    $('figures').innerHTML = '';
  } else {
    $('figures').innerHTML = figs.map(function (f) {
      var src = imgMap[f.fig_no];
      var text = f.caption || '（原文无图题）';
      /* caption 自己常以「图甲：」「图 (a)：」开头，再加前缀会变成「图 1 图甲」 */
      var lead = /^图/.test(text) ? '' : ('图 ' + esc(f.fig_no) + '　');
      var cap = '<div class="fig-cap"><span class="no">' + lead + '</span>' + esc(text) + '</div>';
      if (src) {
        return '<div class="fig"><img src="' + esc(src) + '" alt="图 ' + esc(f.fig_no) + '">' + cap + '</div>';
      }
      /* 原文就没有图的题（is_required=false），不画「图缺」灰框——
         那会把「本来不需要图」误报成「图丢了」。只留图注说明。 */
      if (f.is_required === false) {
        return '<div class="fig-none">' + cap + '</div>';
      }
      return '<div class="fig"><div class="fig-missing">' +
        '<div class="tag">图　缺</div><div>工作区无对应图片文件</div>' +
        '</div>' + cap + '</div>';
    }).join('');
  }

  var given = (a.situation && a.situation.given) || [];
  var gsym = (a.symbols && a.symbols.givens) || [];
  $('givens').innerHTML = given.map(function (g, i) {
    var name = gsym[i] || g.symbol;
    var gu = unitText(g.unit);
    /* 角度在产物里是无量纲（unit=1），直接显示会变成「α = 37」；补一个度符号。 */
    if (!gu && g.value != null && /^(alpha|beta|theta|angA|angB)$/.test(String(name))) gu = '°';
    var head = (g.value == null || g.value === '')
      ? esc(sym(name))
      : esc(sym(name)) + ' = ' + esc(num(g.value)) + esc(gu);
    var src = g.source === 'figure' ? '<span class="src">图上读出</span>' : '';
    return '<div class="given"><span class="k">' + head + '</span>' +
      '<span class="v">' + esc(g.text || '') + src + '</span></div>';
  }).join('');

  var sq = q.subquestions || [];
  $('subqs').innerHTML = sq.map(function (s) {
    return '<div class="subq"><span class="no">' + esc(s.no) + '</span>' +
      '<span class="tx">' + esc(s.text) + '</span>' +
      (s.score != null ? '<span class="sc">' + num(s.score) + ' 分</span>' : '') + '</div>';
  }).join('');
}

/* 图例里的动态统计：这一题到底有多少步真的检查过。
   整题层的 layers 只有「全 pass / 有 fail / 其它」三态，15/20 题是 na，
   放在顶栏看不出信息；步骤级统计才有区分度。 */
function renderLegendStat(a) {
  var steps = a.steps || [];
  var c = { L1: { pass: 0, fail: 0, na: 0 }, L2: { pass: 0, fail: 0, na: 0 } };
  for (var i = 0; i < steps.length; i++) {
    var cs = steps[i].checks || [];
    for (var j = 0; j < cs.length; j++) {
      var k = cs[j].layer;
      if (!c[k]) continue;
      var v = cs[j].status === 'pass' ? 'pass' : (cs[j].status === 'fail' ? 'fail' : 'na');
      c[k][v]++;
    }
  }
  var bits = [];
  ['L1', 'L2'].forEach(function (k) {
    var x = c[k], n = x.pass + x.fail + x.na;
    if (!n) return;
    var seg = k + ' 通过 ' + x.pass + '/' + n + ' 步';
    if (x.fail) seg += ' · 存疑 ' + x.fail;
    if (x.na) seg += ' · 未检 ' + x.na;
    bits.push(seg);
  });
  $('lg-stat').textContent = bits.join('　|　');
}

/* 采分点明细：把「哪一分丢了、为什么」摆出来。
   原来页面上只有顶栏一个汇总数，用户看不到点级状态，
   也看不到 na 的真实原因（欠定 / 无锚点 / 符号不认识）。 */
function renderPointTable(a) {
  var g = a.grading || {};
  var pts = g.points || [];
  if (!pts.length) {
    $('ptable').hidden = true;
    return;
  }
  $('ptable').hidden = false;

  var hit = 0, na = 0, miss = 0, full = 0, got = 0;
  for (var i = 0; i < pts.length; i++) {
    var c = pts[i].credit;
    if (c === 'hit') hit++;
    else if (c === 'miss') miss++;
    else na++;
    full += Number(pts[i].possible || 0);
    got  += Number(pts[i].score || 0);
  }
  $('pt-tag').textContent = pts.length + ' 点 · ' + full + ' 分（得 ' + got + '）';

  var ST = { hit: '命中', miss: '未命中', na: '判不了' };
  $('pt-body').innerHTML = pts.map(function (q) {
    var c = (q.credit === 'hit' || q.credit === 'miss') ? q.credit : 'na';
    var cells = String(q.point_id || '').split('-');
    var sid = cells[cells.length - 1];
    /* 采分点编号与步骤编号不是一套：采分点 S02 可能由步骤 S04 承载。
       只写 S02 会让人以为是右边第 2 步，所以把承载步也标出来。 */
    var by = (q.by || []);
    var byTxt = by.length
      ? '第 ' + by.map(function (x) {
          var a = String(x).split('-'), k = a[a.length - 1].replace(/^S/, '');
          return k;
        }).join('、') + ' 步'
      : '无承载步';
    return '<div class="pt-row ' + c + '" title="' + esc(mapBasis(a, q.basis || '', by[0])) + '">' +
      '<span class="pt-id">' + esc(sid) + '</span>' +
      '<span class="pt-st">' + ST[c] + '</span>' +
      '<span class="pt-sc">' + num(q.possible) + '</span>' +
      '<span class="pt-why"><span class="pt-by">' + esc(byTxt) + '</span>' +
        esc(q.human || '') + '</span>' +
      '</div>';
  }).join('');
}

function renderPlan(a) {
  var out = a.outline || [], hits = hitMap(a);
  var steps = a.steps || [], total = 0;
  var byNo = {};
  for (var i = 0; i < steps.length; i++) byNo[steps[i].step_no] = steps[i];

  $('plan-body').innerHTML = out.map(function (o) {
    var s = byNo[o.step_no] || {};
    var h = hits[s.step_id] || {};
    var dep = (o.depends_on && o.depends_on.length)
      ? '<span class="dep">接第 ' + o.depends_on.join('、') + ' 步</span>' : '';
    return '<div class="plan-row">' +
      '<span class="n">' + pad2(o.step_no) + '</span>' +
      '<span class="t"><a href="#s-' + esc(s.step_id || o.step_no) + '">' + esc(o.title || s.title || '') + '</a></span>' +
      dep +
      '<span class="sc" title="采分点满分，不是得分；实际得分写在分步解析每步右侧">' +
        (h.score_possible != null ? num(h.score_possible) + ' 分' : '') + '</span>' +
      '</div>';
  }).join('');

  for (var k = 0; k < steps.length; k++) {
    var hh = hits[steps[k].step_id];
    if (hh && hh.score_possible != null) total += Number(hh.score_possible);
  }
  $('plan-tag').textContent = (a.meta && a.meta.mode === 'zero')
    ? (out.length + ' 步')
    : (out.length + ' 步 · 合计 ' + total + ' 分');
}

function lawHTML(ids) {
  if (!ids || !ids.length) return '';
  return '<div class="laws">' + ids.map(function (id) {
    var L = LAWS[id];
    var name = L ? L.name : id;
    var tip = L ? (L.one_liner || '') + (L.misuse ? '\n\n典型误用：' + L.misuse : '') : '';
    return '<span class="law" title="' + esc(tip) + '">' + esc(id) + ' ' + esc(name) + '</span>';
  }).join('') + '</div>';
}

function valueHTML(step, disp) {
  var v = step.value;
  if (!v) return '';
  disp = disp || {};
  var vsym = disp.vsym || v.symbol;
  var exact = disp.vexact || v.exact;
  var u = unitText(v.unit), shown = '', tag = '';
  if (v.number != null && v.number !== '') {
    shown = numHTML(v.number);
  } else if (exact) {
    var pe = renderValueExpr(exact);
    if (!pe) return '';
    shown = esc(pe.shown);
    tag = '<span class="tag-sym" title="JSON: ' + esc(pe.raw) + '">符号解</span>';
  } else return '';

  var dir = v.direction ? '<span class="dir">（方向 ' + esc(v.direction) + '）</span>' : '';
  return '<div class="value"><span class="arrow">⇒</span>' +
    esc(sym(vsym)) + ' = ' + shown + esc(u) + dir + tag + '</div>';
}

/* 步骤右侧的分值：显示「得分/满分」，不是满分本身。
   采分点会按承载步聚合（同一步可能挂 2 个点），所以这里用 n_hit/n_na/n_miss。 */
function stepScoreHTML(h) {
  if (!h || h.score_possible == null) return '';
  var aw = Number(h.score_awarded || 0), po = Number(h.score_possible || 0);
  var nh = Number(h.n_hit || 0), nn = Number(h.n_na || 0), nm = Number(h.n_miss || 0);
  var cls, txt;
  if (nm) { cls = 'miss'; txt = '得 ' + num(aw) + '/' + num(po) + ' 分'; }
  else if (!nh) { cls = 'na'; txt = '未判 0/' + num(po) + ' 分'; }
  else if (nn) { cls = 'part'; txt = '得 ' + num(aw) + '/' + num(po) + ' 分 · ' + nn + ' 点未判'; }
  else { cls = 'hit'; txt = '得 ' + num(aw) + '/' + num(po) + ' 分'; }
  var tip = '这一步承载 ' + (h.n || 1) + ' 个采分点：命中 ' + nh +
    '、判不了 ' + nn + '、判错 ' + nm + '。右侧是采分点得分，不是满分。';
  return '<span class="step-score ' + cls + '" title="' + esc(tip) + '">' + txt + '</span>';
}

/* 校验记录：L4 已经提炼成上面的「容易错在/关键」，这里不再重复；
   L1/L2 是内部账（回代残差、量纲），收进折叠行，避免正文被噪音占满。 */
function checksHTML(step, zero) {
  var cs = (step.checks || []).filter(function (c) { return c.layer !== 'L4'; });
  if (!cs.length) {
    /* 新题：一行校验记录都没有，说明验证器根本没进这一层，也别假装检过 */
    if (zero) return '<div class="chkrec chk-na">校验 L1· L2· <span>新题符号未登记，这一层没检</span></div>';
    return '';
  }
  if (zero) {
    /* 新题没有符号白名单，check 全是 data_error(unknown_symbol)。
       直接摊开会把内部报错串摆给用户看（旧缺陷 5），这里折成一句人话。 */
    var onlyErr = cs.every(function (c) {
      return /data_error/.test(String(c.detail || '')) || c.status === 'na';
    });
    if (onlyErr) {
      return '<div class="chkrec chk-na">校验 L1· L2· ' +
        '<span>新题的符号不在登记表里，这一层没检——不是「检过且通过」</span></div>';
    }
  }
  var brief = cs.map(function (c) {
    return esc(c.layer) + (c.status === 'pass' ? '✓' : c.status === 'fail' ? '✗' : '·');
  }).join(' ');
  var lines = cs.map(function (c) {
    return '<div class="cl"><b class="' + esc(c.status) + '">' + esc(c.layer) + '</b>' +
      '<span>' + esc(c.detail || c.status) + '</span></div>';
  }).join('');
  return '<details class="chkrec"><summary>校验 ' + brief + '</summary>' + lines + '</details>';
}

/* 「为什么」：statement 之外的补充；criterion 与 L4 去重后取最多两条 */
function whyHTML(step) {
  var stmt = step.statement || '';
  var cand = [];

  var crit = (step.criterion && step.criterion.text) || '';
  if (crit && similar(crit, stmt) < 0.6) {
    cand.push({ lb: '判　据', tx: crit, trap: false });
  }

  var cs = step.checks || [];
  for (var i = 0; i < cs.length; i++) {
    if (cs[i].layer !== 'L4' || !cs[i].detail) continue;
    var d = cs[i].detail;
    if (similar(d, stmt) >= 0.6) continue;
    var dup = false;
    for (var j = 0; j < cand.length; j++) if (similar(d, cand[j].tx) >= 0.6) dup = true;
    if (dup) continue;
    var trap = /0 分|会得|变成|失效|漏|误|判错|错成/.test(d);
    cand.push({ lb: trap ? '容易错在' : '这一步的关键', tx: d, trap: trap });
  }

  if (!cand.length) return '';
  return cand.slice(0, 2).map(function (c) {
    return '<div class="why' + (c.trap ? ' trap' : '') + '">' +
      '<span class="lb">' + c.lb + '</span>' +
      '<span class="tx">' + esc(c.tx) + '</span></div>';
  }).join('');
}

function renderSteps(a) {
  var steps = a.steps || [], hits = hitMap(a);
  if (!steps.length) {
    $('steps').innerHTML = '<div class="empty">这道题没有步骤数据。</div>';
    return;
  }
  $('paper-note').textContent = (a.meta && a.meta.mode === 'zero')
    ? steps.length + ' 步 · 每步的式子、结果与依据'
    : steps.length + ' 步 · 逐步给出分值与依据';

  $('steps').innerHTML = steps.map(function (s) {
    var h = hits[s.step_id] || {};
    var disp = (a.symbols && a.symbols.steps && a.symbols.steps[s.step_id]) || {};
    var p = prettify(disp.eq || (s.equation && s.equation.sympy));
    var vsym = disp.vsym || (s.value && s.value.symbol);
    var eqBlock = '';

    /* 结果步里 equation 常常就是「v = 4」，与下面的 ⇒ v = 4.0 m/s 是同一句话，
       两行并排只是把 JSON 内部 4 / 4.0 的写法差异暴露出来。合并成一行。 */
    var merged = false;
    if (p && s.kind === 'value' && s.value && s.value.number != null) {
      var mm = /^([A-Za-zμ][A-Za-z0-9_]*)\s*=\s*(-?\d+(?:\.\d+)?)$/.exec(p.shown.trim());
      if (mm && mm[1] === String(vsym) &&
          Math.abs(parseFloat(mm[2]) - parseFloat(s.value.number)) < 1e-9) merged = true;
    }

    if (p && !merged) {
      eqBlock = '<div class="eqbox"><div class="eq">' + esc(p.shown) +
        (needsRaw(p.raw, p.shown) ? '<span class="raw">raw: ' + esc(p.raw) + '</span>' : '') +
        '</div></div>';
    }
    var kindName = KIND_NAME[s.kind] || s.kind || '';

    return '<section class="step" id="s-' + esc(s.step_id) + '">' +
      '<span class="step-no">' + pad2(s.step_no) + '</span>' +
      '<div class="step-head">' +
        '<span class="step-title">' + esc(s.title || '') + '</span>' +
        (kindName ? '<span class="kind">' + esc(kindName) + '</span>' : '') +
        stepScoreHTML(h) +
      '</div>' +
      lawHTML(s.law_ids) +
      (s.statement ? '<div class="stmt">' + esc(s.statement) + '</div>' : '') +
      eqBlock + valueHTML(s, disp) + whyHTML(s) +
      checksHTML(s, a.meta && a.meta.mode === 'zero') +
      '</section>';
  }).join('');
}

function renderFoot(a) {
  var m = a.meta || {}, g = a.grading || {};
  var t = a.triage || {};
  var zero = m.mode === 'zero';
  var bits = [];
  bits.push('题目来源：' + (m.source || '未记') + (m.question_no != null ? ' 第' + m.question_no + ' 题' : ''));
  if (zero) {
    bits.push('卷面总分：' + (m.full_score != null ? num(m.full_score) + ' 分（题干小问标注合计）' : '未标注'));
    bits.push('<b>本题不判分。</b>题库外新题没有人工采分点；模型自己写的「采分点」用来判自己，等于自证，' +
      '所以只出解析与自洽检查，不给分。');
  } else {
    bits.push('卷面总分：' + num(g.score_total) + ' 分（采分点满分合计）');
  }
  if (t.level) bits.push('归零风险：' + esc(t.level) + (t.reason ? ' · ' + esc(t.reason) : ''));
  var u = g.unattached || {};
  if (u.count) {
    bits.push('另 <b>' + u.count + '</b> 个采分点（合计 ' + num(u.score_possible) +
      ' 分）没有对应的步骤，分值仍计入卷面总分，但不挂到任何一步：' +
      esc((u.points || []).join('、')) + '。');
  }
  if (!zero) {
    bits.push('计分口径：<b>命中</b>记满分；<b>判不了</b>的采分点记 0 分但<b>不算错</b>——' +
      '它在 0 到满分之间，不进得分也不扣分。所以「得分/总分」不等于答对率，' +
      '只等于<b>能确认的那部分</b>。');
  }
  $('foot').innerHTML = bits.join('<br>');
}

function renderQList() {
  $('qlist').innerHTML = IDS.map(function (id) {
    var m = ANSWERS[id].meta || {};
    return '<button class="qitem' + (id === cur ? ' active' : '') + '" data-id="' + esc(id) + '">' +
      '<b>' + esc(id) + '</b>' + esc((m.source || '') +
      (m.question_no != null ? ' 第' + m.question_no + '题' : '')) + '</button>';
  }).join('');
}

function renderBanner(a) {
  var zero = a && a.meta && a.meta.mode === 'zero';
  if (!zero) return;                    /* 20 题的横幅是静态文案，保持原样 */
  $('banner').innerHTML =
    '这是 <b>deepseek-flash</b> 现场解出来的，<b>不是标准答案</b>，也<b>没有判分</b>——' +
    '题库外新题没有人工采分点。每步的 L1/L2 只验「这一步自身是否自洽」（量纲、回代），' +
    '而且新题的符号不在登记表里，<b>这一层多数没检</b>。' +
    '下面给的是思路、式子和结果，对不对要你自己核。';
}

function renderRunbar() {
  var r = DATA.run;
  if (!r) { $('runbar').hidden = true; return; }
  var bits = [];
  bits.push('<span class="k">本次运行</span> ' +
    (r.mode === 'zero'
      ? '<b>新题现场生成</b>：deepseek-flash 调用，无金标、无采分点'
      : (r.mode === 'live'
        ? '<b>实时生成</b>：deepseek-flash 现场调用'
        : '<b>演示模式</b>：复用既有模型产物，<span class="warn">未调用 API</span>')));
  if (r.elapsed_s != null) bits.push('总耗时 ' + num(r.elapsed_s) + ' s');
  if (r.cost_cny != null && r.cost_cny > 0) bits.push('约 ' + num(r.cost_cny) + ' 元');
  bits.push(r.mode === 'zero' ? '验证器为本次重跑；新题未判分' : '校验器与判分器为本次重跑');
  if (r.job_id) bits.push('任务 ' + esc(r.job_id));
  if (r.finished_at) bits.push(esc(r.finished_at));
  $('runbar').innerHTML = bits.join('<span class="sep">·</span>');
  $('runbar').hidden = false;
}

function renderAll() {
  renderRunbar();
  var a = ANSWERS[cur];
  if (!a) {
    $('steps').innerHTML = '<div class="empty">没有数据。<br><br>' +
      '在工作区运行 <code>python 原型/_build.py</code> 注入 answer JSON。</div>';
    return;
  }
  renderBanner(a);
  renderTop(a);
  renderSidebar(a);
  renderLegendStat(a);
  renderPointTable(a);
  renderPlan(a);
  renderSteps(a);
  renderFoot(a);
}

/* ---------- 事件 ---------- */
$('qbtn').addEventListener('click', function (e) {
  e.stopPropagation();
  $('qlist').hidden = !$('qlist').hidden;
});
$('qlist').addEventListener('click', function (e) {
  var b = e.target.closest('.qitem');
  if (!b) return;
  cur = b.getAttribute('data-id');
  $('qlist').hidden = true;
  renderQList();
  renderAll();
  window.scrollTo(0, 0);
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('#qbtn') && !e.target.closest('#qlist')) $('qlist').hidden = true;
});

renderQList();
renderAll();

})();
</script>
</body>
</html>
