<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物理大题 · 批改台（原型）</title>
<style>
/* ============ 基础 ============ */
:root{
  --ink:#1b1b1b;
  --ink2:#4d4d4d;
  --ink3:#8c8c8c;
  --ink4:#b3b3b3;
  --line:#e2dfd6;
  --paper:#fdfcf8;
  --desk:#f1efe9;
  --panel:#f8f6f1;
  --red:#C0392B;
  --green:#2E7D4F;
  --gray:#a8a8a8;
  --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"Cascadia Mono","Consolas","SF Mono","Menlo",monospace;
  --kai:"Kaiti SC","KaiTi","STKaiti","楷体",serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  display:flex;flex-direction:column;
  font-family:var(--sans);
  color:var(--ink);
  background:var(--desk);
  -webkit-font-smoothing:antialiased;
}

/* ============ 顶部信息条 ============ */
#topbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:14px;
  height:52px;padding:0 18px;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  z-index:30;
}
.spacer{flex:1 1 auto;}

.qsel{position:relative;}
.btn{
  font:inherit;font-size:13px;
  padding:5px 12px;border:1px solid var(--line);
  border-radius:3px;background:#fff;color:var(--ink);
  cursor:pointer;line-height:1.5;
}
.btn:hover{background:#f6f4ee;}
.btn-primary{border-color:var(--red);color:var(--red);}
.btn-primary:hover{background:#fbf0ee;}
.btn-sm{padding:3px 10px;font-size:12.5px;}
.btn-icon{
  width:24px;height:24px;padding:0;line-height:1;
  border:1px solid var(--line);border-radius:3px;background:#fff;
  color:var(--ink3);cursor:pointer;font-size:13px;
}
.btn-icon:hover{background:#f0eee7;color:var(--ink);}
.caret{font-size:10px;color:var(--ink3);}

.qlist{
  position:absolute;top:calc(100% + 5px);left:0;
  min-width:270px;max-height:70vh;overflow:auto;
  background:#fff;border:1px solid var(--line);
  border-radius:4px;box-shadow:0 6px 22px rgba(0,0,0,.09);
  padding:4px;z-index:50;
}
.qlist[hidden]{display:none;}
.qitem{
  display:block;width:100%;text-align:left;
  font:inherit;font-size:13px;
  padding:7px 10px;border:0;background:none;border-radius:3px;
  cursor:pointer;color:var(--ink2);
}
.qitem:hover{background:#f5f2ea;color:var(--ink);}
.qitem.active{background:#fbf0ee;color:var(--red);}

.qtitle{font-size:13.5px;color:var(--ink2);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.score{font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;}
.score b{font-weight:600;}

.layers{display:flex;gap:4px;}
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:26px;height:19px;padding:0 4px;
  font-size:11px;font-variant-numeric:tabular-nums;
  border-radius:2px;border:1px solid transparent;
  letter-spacing:.3px;
}
.badge.pass{background:#eaf3ed;color:var(--green);border-color:#cfe3d5;}
.badge.fail{background:#fbeceb;color:var(--red);border-color:#f0cdc9;}
.badge.na{background:#f2f1ee;color:var(--gray);border-color:#e4e2dc;}

.gold{
  font-size:11.5px;color:var(--ink3);
  padding:2px 8px;border:1px dashed var(--line);border-radius:2px;
  white-space:nowrap;
}
.gold.off{display:none;}
#stem-btn{display:none;}

/* ============ 主区 ============ */
#main{flex:1 1 auto;display:flex;min-height:0;position:relative;}

/* --- 左栏 --- */
#sidebar{
  flex:0 0 34%;max-width:520px;min-width:280px;
  display:flex;flex-direction:column;
  background:var(--panel);
  border-right:1px solid var(--line);
  overflow:hidden;
  transition:flex-basis .18s ease, min-width .18s ease;
}
#sidebar .rail{display:none;}
#sidebar .panel{
  flex:1 1 auto;overflow-y:auto;
  padding:16px 18px 40px;
  display:flex;flex-direction:column;gap:0;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;letter-spacing:2px;color:var(--ink3);
  padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
#main.collapsed #sidebar{flex:0 0 40px;min-width:40px;max-width:40px;}
#main.collapsed #sidebar .panel{display:none;}
#main.collapsed #sidebar{position:relative;}
#main.collapsed #sidebar .rail{
  display:flex;align-items:center;justify-content:center;
  position:absolute;inset:0;
  writing-mode:vertical-rl;letter-spacing:6px;
  font-size:12px;color:var(--ink3);cursor:pointer;
  background:var(--panel);
}
#main.collapsed #sidebar .rail:hover{color:var(--red);background:#f3f0e8;}

.stem{font-size:13.5px;line-height:1.95;color:var(--ink2);text-align:justify;}
.stem em{font-style:normal;color:var(--ink);}

.sec-title{
  font-size:11.5px;letter-spacing:2px;color:var(--ink4);
  margin:20px 0 8px;padding-top:12px;border-top:1px dashed var(--line);
}

.figures{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.fig{border:1px solid var(--line);background:#fff;}
.fig-missing{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:92px;padding:14px;
  background:repeating-linear-gradient(45deg,#f7f6f2,#f7f6f2 6px,#f2f1ec 6px,#f2f1ec 12px);
  color:var(--ink3);
}
.fig-missing .tag{font-size:12.5px;letter-spacing:3px;color:#9d9a90;}
.fig-missing .sub{font-size:11px;margin-top:5px;color:var(--ink4);}
.fig img{display:block;width:100%;height:auto;}
.fig-cap{
  font-size:11.5px;line-height:1.7;color:var(--ink3);
  padding:7px 9px;border-top:1px solid var(--line);
  background:#fcfbf7;
}
.fig-cap .no{color:var(--ink2);margin-right:5px;}

.givens{display:flex;flex-direction:column;gap:7px;}
.given{font-size:12.5px;color:var(--ink2);line-height:1.75;
  display:grid;grid-template-columns:96px 1fr;gap:2px 10px;align-items:baseline;}
.given .k{font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:nowrap;}
.given .v{color:var(--ink3);font-size:11.5px;line-height:1.7;}

.subqs{display:flex;flex-direction:column;gap:8px;}
.subq{font-size:12.5px;line-height:1.75;color:var(--ink2);display:flex;gap:7px;}
.subq .no{color:var(--ink);flex:0 0 auto;font-variant-numeric:tabular-nums;}
.subq .sc{color:var(--ink4);font-size:11.5px;flex:0 0 auto;margin-left:auto;padding-left:8px;}

/* --- 作答纸 --- */
#paper{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  background:var(--paper);
}
.sheet{
  max-width:880px;margin:0 auto;
  padding:38px 44px 90px;
}

.paper-head{
  display:flex;align-items:baseline;gap:12px;
  padding-bottom:14px;margin-bottom:26px;
  border-bottom:1px solid var(--line);
}
.paper-head .h{font-size:12px;letter-spacing:3px;color:var(--ink4);}
.paper-head .note{font-size:11.5px;color:var(--ink4);margin-left:auto;}

/* 书写流：不是卡片 */
.step{
  position:relative;
  padding-left:46px;
  margin:0 0 26px;
}
.step::before{
  content:"";position:absolute;left:30px;top:5px;bottom:1px;
  width:2px;background:#dcd9d0;
}
.step-no{
  position:absolute;left:0;top:2px;width:22px;text-align:right;
  font-family:var(--mono);font-size:11px;color:var(--ink4);
  letter-spacing:.5px;font-variant-numeric:tabular-nums;
  user-select:none;
}
.step-title{
  font-size:14px;font-weight:500;color:var(--ink);
  line-height:1.8;letter-spacing:.2px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.checks{display:inline-flex;gap:3px;margin-left:2px;}
.chk{
  font-family:var(--mono);font-size:9.5px;line-height:1;
  padding:2px 3px;border-radius:2px;letter-spacing:0;
  border:1px solid transparent;cursor:help;
}
.chk-pass{background:#eef5f0;color:#4f8a68;border-color:#dcebe1;}
.chk-fail{background:#fbeceb;color:var(--red);border-color:#f0cdc9;}
.chk-na,.chk-skipped{background:#f4f3ef;color:#b0ada4;border-color:#e8e6df;}

/* 可点单元 */
.unit{
  position:relative;
  margin-top:7px;
}
.unit.clickable{cursor:pointer;}
.unit.clickable:hover{background:rgba(192,57,43,.045);}
.unit.marked:hover{background:rgba(192,57,43,.03);}

.urow{
  display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;
}
.ucell{
  position:relative;
  display:inline-block;
  max-width:100%;
  padding:1px 2px;
}
.ucell.wide{display:block;flex:1 1 100%;width:100%;}
.eq{
  font-family:var(--mono);
  font-size:15px;line-height:1.9;
  color:var(--ink);
  letter-spacing:.1px;
  white-space:pre-wrap;
  word-break:break-word;
}
.stmt{
  display:block;
  font-size:13px;line-height:1.95;color:#6a6a6a;
  text-align:justify;
}
.unit[data-part="statement"].primary .stmt{
  font-size:15px;color:var(--ink);line-height:2.0;
}

.step-value{
  margin-top:12px;
  font-family:var(--mono);font-size:14.5px;line-height:1.9;
  color:var(--ink);
}
.step-value .arrow{color:var(--ink4);margin-right:6px;}
.step-value .dir{font-family:var(--sans);font-size:12px;color:var(--ink3);}
.tag-sym{
  font-family:var(--sans);font-size:10.5px;
  color:#9a968c;border:1px solid #e6e2d6;border-radius:2px;
  padding:1px 4px;margin-left:8px;vertical-align:1px;
  cursor:help;
}

/* raw 原值 */
.raw{
  position:absolute;left:0;top:100%;z-index:6;
  margin-top:2px;padding:2px 6px;
  font-family:var(--mono);font-size:11px;line-height:1.5;
  color:#a5a29a;background:#fffdf8;
  border:1px solid #efede5;border-radius:2px;
  white-space:nowrap;pointer-events:none;
  display:none;
}
.unit:hover .raw{display:block;}

/* 红叉 */
.cross{
  position:absolute;inset:-6px;
  pointer-events:none;z-index:4;
}
.cross i{
  position:absolute;left:50%;top:50%;
  height:2.5px;margin-top:-1.25px;
  background:var(--red);border-radius:2px;
  transform-origin:50% 50%;
  opacity:.92;
}

/* 红批注 */
.note{
  font-family:var(--kai);
  font-size:14px;line-height:1.6;
  color:var(--red);
  display:inline-block;
  transform:rotate(-1.5deg);
  transform-origin:left center;
  white-space:nowrap;
  margin-bottom:1px;
}
.note .code{font-family:var(--mono);font-size:12.5px;letter-spacing:.3px;}
.note .bar{opacity:.55;margin:0 5px;}
.note .txt{letter-spacing:.4px;}

/* 批改槽 */
.slot{
  margin:9px 0 4px 2px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 10px;
  background:#fffdf8;
  border:1px solid #e8e3d6;
  border-left:3px solid var(--red);
}
.slot select,.slot input{
  font:inherit;font-size:12.5px;
  padding:4px 7px;
  border:1px solid #ddd8c9;border-radius:2px;
  background:#fff;color:var(--ink);
  max-width:280px;
}
.slot select:focus,.slot input:focus{outline:1px solid #d9b7b1;border-color:#d9b7b1;}
.slot .note-in{flex:1 1 180px;min-width:120px;font-family:var(--kai);font-size:13.5px;}
.slot .lb{font-size:11.5px;color:var(--ink3);letter-spacing:1px;}

.erase-bar{
  margin:8px 0 2px 2px;
  display:flex;align-items:center;gap:10px;
}
.erase{
  font:inherit;font-size:12px;
  padding:3px 10px;border:1px dashed #e0cfcb;border-radius:2px;
  background:#fff;color:var(--red);cursor:pointer;
}
.erase:hover{background:#fdf2f0;}
.erase-bar .meta{font-size:11px;color:var(--ink4);font-family:var(--mono);}

/* ============ 底部条 ============ */
#bottombar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:14px;
  height:46px;padding:0 18px;
  background:var(--paper);
  border-top:1px solid var(--line);
  z-index:20;
}
.count{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;}
.count b{color:var(--red);font-weight:600;}
.hint{font-size:11.5px;color:var(--ink4);}

/* ============ 窄屏 ============ */
@media (max-width:1100px){
  #main{display:block;}
  #sidebar{
    position:absolute;left:0;right:0;top:0;
    flex:none;width:100%;max-width:100%;min-width:0;
    max-height:0;height:auto;
    border-right:0;border-bottom:1px solid var(--line);
    box-shadow:none;
    z-index:40;
    transition:max-height .2s ease;
  }
  #main.drawer-open #sidebar{
    max-height:64vh;
    border-bottom:1px solid #d5d1c4;
    box-shadow:0 12px 28px rgba(0,0,0,.14);
  }
  #sidebar .panel{max-height:64vh;overflow-y:auto;}
  #sidebar .rail{display:none !important;}
  #main.collapsed #sidebar{flex:none;max-width:100%;min-width:0;}
  #paper{height:100%;}
  .sheet{padding:26px 22px 80px;}
  .step{padding-left:38px;}
  .step::before{left:24px;}
  .qtitle{max-width:34vw;}
  .gold{display:none;}
  #stem-btn{display:inline-block;}
}
@media (max-width:640px){
  #topbar{gap:8px;padding:0 10px;}
  #bottombar{padding:0 10px;gap:8px;}
  .hint{display:none;}
  .layers{gap:2px;}
  .badge{min-width:22px;font-size:10px;}
}

/* 空态 */
.empty{
  padding:80px 20px;text-align:center;
  color:var(--ink3);font-size:13px;line-height:2;
}
.empty code{font-family:var(--mono);font-size:12px;background:#f4f2ec;padding:2px 6px;}
</style>
</head>

无过程","symptom":"只有结果无过程，最高给本步 1 分；只写 20 m/s 无公式","layer":"L5","severity":"扣分级","auto":"是"},{"code":"E-24","name":"归纳规律不完整","symptom":"只算到第二次未归纳给 1 分","layer":"L5","severity":"扣分级","auto":"否"}],"laws":{"L-01":{"name":"匀变速直线运动公式组","one_liner":"加速度恒定时速度、位移与时间满足三式联立","misuse":"把平均速度当作区间端点的瞬时速度（B-01-S01）；两中间时刻的间隔取 t₁+t₂ 而未取半（B-01-S02）"},"L-02":{"name":"自由落体与竖直上抛","one_liner":"只受重力时初速为零为自由落体、初速向上为竖直上抛","misuse":"最高点时间写成 v₀=½gt² 或 gt²（应 v₀=gt）（B-02-S01）；平抛求时间直接取 √(2h/g) 且 h 用反弹高度（B-08-S05）"},"L-03":{"name":"共点力平衡","one_liner":"物体静止或匀速直线运动时，所受共点力的合力为零","misuse":"把「缓慢」当作有加速度的过程，据此列动力学方程（B-04-S01）"},"L-04":{"name":"牛顿第二定律","one_liner":"加速度与合外力同向，大小与合外力成正比、与质量成反比","misuse":"板块已相对滑动却仍用整体加速度（B-20-S07）；连接体求加速度时合外力漏掉配重质量（B-10-S07）"},"L-05":{"name":"滑动摩擦力","one_liner":"两接触面发生相对滑动时，滑动摩擦力等于 μ 乘正压力","misuse":"斜面题把摩擦项整个漏掉、当作光滑处理（B-15-S01）；滑动摩擦项漏乘 cosθ（B-16-S01）"},"L-06":{"name":"圆周运动与向心力","one_liner":"做圆周运动的物体，向心加速度由指向圆心的合力提供","misuse":"临界半径取成 3L 或 L（应 2L）（A-09-S07）；向心力分母的半径取成 2R 或 d（应 R）（A-08-S02）"},"L-07":{"name":"万有引力与天体运动","one_liner":"天体间引力提供环绕天体做圆周运动的向心力","misuse":"球外速度用 R 代替 r 写成 v=√(GM/R)（A-10-S02）；球内质量按面积比写成 M₀=Mr²/R²（应体积比 Mr³/R³）（A-10-S03）"},"L-08":{"name":"功、功率与动能定理","one_liner":"恒力做功等于力乘沿力方向的位移，动能定理把总功与动能变化连起来","misuse":"用 ½mv² = mgx sinθ 时漏掉摩擦做功（B-16-S02）；把位移 s 当作下落高度 h₃ 代入重力功（B-19-S07）"},"L-09":{"name":"机械能守恒","one_liner":"系统内只有重力或弹力做功时，动能与势能之和不变","misuse":"漏掉「速度减为 1/3 时仍有动能」的末态项（A-05-S02，口径原文标「最常见错误」）；自由下落写 mgh=½mv₀² 漏掉 R（A-05-S04）"},"L-10":{"name":"功能关系与摩擦生热","one_liner":"其他力做功等于机械能变化，摩擦生热等于 f 乘相对路程","misuse":"生热 Q 用相对位移代替相对路程（A-08-S11，应 9.5 m 非 3.3 m）；Q 漏乘 μ 或质量取成 mₐ（A-08-S11）"},"L-11":{"name":"动量定理","one_liner":"合外力的冲量等于物体动量的变化量","misuse":"把冲量后速度直接当作 I/m_b＝3 m/s，漏掉原有 1 m/s 向左（A-08-S08，口径原文标「本题最大失分点」）"},"L-12":{"name":"动量守恒","one_liner":"系统合外力为零时，系统总动量保持不变","misuse":"第二次碰撞 A 已反向却未在动量式中取负号（A-02-S10）；断开后仍用 v₀ 代入而非 v₀/3（A-05-S06）"}},"images":{"A-02":{"2":"../原始资料/题图/A-02_图2.png"},"B-09":{"1":"../原始资料/题图/B-09_图1.png"},"B-20":{"2":"../原始资料/题图/B-20_图乙.png","1":"../原始资料/题图/B-20_图甲.png"}}}</script>
<script>
/* =========================================================================
   1. 数据与状态
   ========================================================================= */
(function () {
'use strict';

var DATA;
try { DATA = JSON.parse(document.getElementById('DATA').textContent || '{}'); }
catch (e) { DATA = {}; }

var ANSWERS = DATA.answers || {};
var ERRORS  = DATA.error_codes || [];
var IMAGES  = DATA.images || {};
var IDS     = Object.keys(ANSWERS);

var LS_PREFIX = 'proto:';
/* 默认打开 A-08（任务卡的验收基准题），没有则取第一题 */
var cur = ANSWERS['A-08'] ? 'A-08' : (IDS[0] || null);
var marksCache = {};
var openUid = null;      // 当前展开的批改槽
var eraseUid = null;     // 当前展开的擦除条

/* =========================================================================
   2. 工具
   ========================================================================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function sym(s) {
  if (s == null) return '';
  return String(s).replace(/\bmu\b/g, 'μ').replace(/\btheta\b/g, 'θ');
}
function num(v) {
  if (v == null) return '';
  return String(v);   // 保留 JSON 原文本（build 时 parse_float=str）
}
function unitText(u) {
  if (!u || u === '1') return '';
  return ' ' + String(u).replace(/\^2/g, '²').replace(/\^3/g, '³');
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }

/* ---- 确定性哈希：step_id -> [-4, +4] 度 ---- */
function hashAngle(key) {
  var h = 2166136261;
  for (var i = 0; i < key.length; i++) {
    h ^= key.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  var u = h >>> 0;
  var deg = (u % 8001) / 1000 - 4;   // -4.000 .. +4.000
  return Math.round(deg * 10) / 10;
}

/* =========================================================================
   3. 式子美化（纯显示层；原值永远可通过 raw 查看）
   ========================================================================= */
function matchParen(s, i) {
  var d = 0;
  for (var j = i; j < s.length; j++) {
    if (s[j] === '(') d++;
    else if (s[j] === ')') { d--; if (d === 0) return j; }
  }
  return -1;
}
function isWrapped(s) {
  return s.charAt(0) === '(' && matchParen(s, 0) === s.length - 1;
}
function stripOuter(s) {
  s = s.trim();
  while (isWrapped(s)) s = s.slice(1, -1).trim();
  return s;
}

/* 顶层按 + / - 切分，返回 [{sign, term}] */
function splitTop(expr) {
  var s = String(expr).trim();
  var out = [], depth = 0, start = 0, sign = 1;
  for (var i = 0; i < s.length; i++) {
    var c = s[i];
    if (c === '(') depth++;
    else if (c === ')') depth--;
    else if (depth === 0 && (c === '+' || c === '-')) {
      if (i === 0) { sign = (c === '-') ? -1 : 1; start = 1; }
      else {
        var t = s.slice(start, i).trim();
        if (t) out.push({ sign: sign, term: t });
        sign = (c === '-') ? -1 : 1;
        start = i + 1;
      }
    }
  }
  var last = s.slice(start).trim();
  if (last) out.push({ sign: sign, term: last });
  return out;
}

/* 顶层按 * / 切分（** 视为指数，不切） */
function splitFactors(term) {
  var s = term, depth = 0, start = 0, parts = [], ops = [];
  for (var i = 0; i < s.length; i++) {
    var c = s[i];
    if (c === '(') depth++;
    else if (c === ')') depth--;
    else if (depth === 0 && c === '*' && s[i + 1] === '*') { i++; }
    else if (depth === 0 && (c === '*' || c === '/')) {
      parts.push(s.slice(start, i));
      ops.push(c);
      start = i + 1;
    }
  }
  parts.push(s.slice(start));
  return { parts: parts, ops: ops };
}

var SUP = {
  '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸',
  '1/2': '½', '1/3': '⅓', '2/3': '⅔', '-1': '⁻¹', '-2': '⁻²'
};

/* 渲染单个因子 -> {text, kind}  kind: num | atom | compound */
function renderFactor(f) {
  var t = f.trim();
  if (!t) return { text: '', kind: 'atom' };

  /* Rational(a,b) */
  var m = t.match(/^Rational\(\s*(-?\d+)\s*,\s*(-?\d+)\s*\)$/);
  if (m) return { text: m[1] + '/' + m[2], kind: 'compound' };

  /* 整体括号 */
  if (isWrapped(t)) {
    return { text: '(' + renderExpr(t.slice(1, -1)) + ')', kind: 'compound' };
  }

  /* 指数 */
  var pi = t.indexOf('**');
  if (pi > 0) {
    var base = t.slice(0, pi).trim();
    var exp  = t.slice(pi + 2).trim();
    var bt;
    if (isWrapped(base)) bt = '(' + renderExpr(base.slice(1, -1)) + ')';
    else bt = sym(base);
    var key = exp.replace(/[()\s]/g, '');
    var su = SUP[key];
    if (su) return { text: bt + su, kind: 'atom' };
    return { text: bt + '^' + key, kind: 'compound' };
  }

  /* 纯数字 */
  if (/^-?\d+(\.\d+)?$/.test(t)) return { text: t, kind: 'num' };

  /* 表达式兜底（含空格或内部加减，如 2*a2 已被切走，这里极少见） */
  if (/[\s]/.test(t) && /[+\-]/.test(t)) {
    return { text: '(' + renderExpr(t) + ')', kind: 'compound' };
  }

  return { text: sym(t), kind: 'atom' };
}

/* 渲染一个 term（乘除链） */
function renderTerm(term) {
  var sf = splitFactors(term);
  var items = sf.parts.map(renderFactor);
  if (!items.length) return '';

  /* 首因子若本身含 / · 等复合结构，且后面还要乘除，必须括起来 */
  var out = items[0].text;
  if (items.length > 1 && items[0].kind === 'compound' &&
      items[0].text.charAt(0) !== '(') {
    out = '(' + out + ')';
  }
  for (var i = 1; i < items.length; i++) {
    var op = sf.ops[i - 1];
    var prev = items[i - 1], now = items[i];
    if (op === '/') {
      out += '/' + (now.kind === 'compound' && now.text.charAt(0) !== '('
        ? '(' + now.text + ')' : now.text);
    } else {
      /* 乘法：数字在前且后接原子 → 连写；否则用间隔点 */
      if (prev.kind === 'num' && now.kind === 'atom' && /^[A-Za-zμΔ]/.test(now.text)) {
        out += now.text;
      } else {
        out += '·' + now.text;
      }
    }
  }
  return out;
}

/* 渲染整个表达式（不含等式重排） */
function renderExpr(expr) {
  var terms = splitTop(expr);
  var buf = '';
  for (var i = 0; i < terms.length; i++) {
    var s = renderTerm(terms[i].term);
    if (i === 0) buf += (terms[i].sign < 0 ? '−' : '') + s;
    else buf += (terms[i].sign < 0 ? ' − ' : ' + ') + s;
  }
  return buf;
}

/* 等式重排：A - B = 0  ⟺  A = B */
function prettify(sympy) {
  var raw = String(sympy || '').trim();
  if (!raw) return null;

  var terms;
  try { terms = splitTop(raw); } catch (e) { return { shown: raw, isEq: false, raw: raw, unparsed: true }; }
  if (!terms.length) return { shown: raw, isEq: false, raw: raw, unparsed: true };

  var pos = [], neg = [];
  for (var i = 0; i < terms.length; i++) {
    var sg = terms[i].sign;
    var tm = terms[i].term;
    /* -(0 - X)  ⟶  +X ：动能定理里常见的写法 */
    var m0 = tm.match(/^\(\s*0\s*-\s*([\s\S]+)\)$/);
    if (m0) { tm = m0[1]; sg = -sg; }
    (sg > 0 ? pos : neg).push(tm);
  }

  var L = pos.map(renderTerm).join(' + ');
  var R = neg.map(renderTerm).join(' + ');

  var out;
  if (!pos.length) out = '0 = ' + R;
  else if (!neg.length) {
    /* 多个括号并列相加：本就不是一个等式，原样给，不硬补 = 0 */
    out = (pos.length === 1) ? (L + ' = 0') : L;
  }
  else out = L + ' = ' + R;

  var unparsed = /\*|Rational\(|sqrt\(|Piecewise/.test(out);
  return { shown: unparsed ? raw : out, isEq: !unparsed, raw: raw, unparsed: unparsed };
}

/* 只渲染、不重排（用于 value.exact 这类「值」而不是「方程」） */
function renderValueExpr(s) {
  var raw = String(s || '').trim();
  if (!raw) return null;
  var out;
  try { out = renderExpr(raw); } catch (e) { out = raw; }
  var unparsed = /\*|Rational\(|sqrt\(|Piecewise/.test(out);
  return { shown: unparsed ? raw : out, raw: raw, unparsed: unparsed };
}

/* 美化是否真的改变了内容（决定是否显示 raw 行） */
function needsRaw(raw, shown) {
  return String(raw).replace(/\s+/g, '') !== String(shown).replace(/\s+/g, '');
}

/* =========================================================================
   4. localStorage（file:// 下个别浏览器会拒绝，失败则退化为内存）
   ========================================================================= */
function loadMarks(id) {
  if (marksCache[id]) return marksCache[id];
  var arr = [];
  try {
    var raw = localStorage.getItem(LS_PREFIX + id);
    if (raw) {
      var o = JSON.parse(raw);
      if (o && Array.isArray(o.marks)) arr = o.marks;
    }
  } catch (e) { /* 退化为内存 */ }
  marksCache[id] = arr;
  return arr;
}
function saveMarks(id, arr) {
  marksCache[id] = arr;
  try {
    localStorage.setItem(LS_PREFIX + id, JSON.stringify({ answer_id: id, marks: arr }));
  } catch (e) { /* 忽略 */ }
}
function findMark(id, stepId, part) {
  var arr = loadMarks(id);
  for (var i = 0; i < arr.length; i++) {
    if (arr[i].step_id === stepId && arr[i].part === part) return arr[i];
  }
  return null;
}
function nowISO() {
  var d = new Date();
  var off = -d.getTimezoneOffset();
  var sg = off >= 0 ? '+' : '-';
  var hh = pad2(Math.floor(Math.abs(off) / 60));
  var mm = pad2(Math.abs(off) % 60);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
    + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds())
    + sg + hh + ':' + mm;
}

/* =========================================================================
   5. 渲染：顶部 / 左栏
   ========================================================================= */
var $ = function (id) { return document.getElementById(id); };

function renderTop(a) {
  var m = a.meta || {};
  $('qtitle').textContent = m.answer_id + ' · ' + (m.source || '') +
    (m.question_no != null ? ' 第' + m.question_no + '题' : '');
  $('qtitle').title = m.answer_id + ' · ' + (m.source || '');

  var g = a.grading || {};
  $('score').innerHTML = '<b>' + num(g.score_awarded) + '</b> / ' + num(g.score_total) + ' 分';

  var layers = (a.validation && a.validation.layers) || {};
  var keys = ['L1', 'L2', 'L3', 'L4'];
  $('layers').innerHTML = keys.map(function (k) {
    var v = layers[k] || 'na';
    return '<span class="badge ' + esc(v) + '" title="' + k + ' · ' + esc(v) + '">' + k + '</span>';
  }).join('');

  var gold = $('gold');
  if (m.mode === 'gold') {
    gold.className = 'gold';
    gold.textContent = '金标参考解 · 非模型输出';
  } else {
    gold.className = 'gold off';
    gold.textContent = '';
  }
}

function renderSidebar(a) {
  var q = a.question || {};

  /* 题干：把题号/小问前的全角空格理顺，段落化 */
  var stem = String(q.stem_text || '').trim();
  $('stem').innerHTML = esc(stem).replace(/\n/g, '<br>');

  /* 图区 */
  var figs = q.figures || [];
  var imgMap = IMAGES[cur] || {};
  if (!figs.length) {
    $('figures').innerHTML = '';
  } else {
    $('figures').innerHTML = figs.map(function (f) {
      var src = imgMap[f.fig_no];
      var cap = '<div class="fig-cap"><span class="no">图' +
        (f.fig_no != null ? f.fig_no : '') + '</span>' + esc(f.caption || '（无图题）') + '</div>';
      if (src) {
        return '<div class="fig"><img src="' + esc(src) + '" alt="图' + f.fig_no +
          '">' + cap + '</div>';
      }
      return '<div class="fig"><div class="fig-missing">' +
        '<div class="tag">缺　图</div>' +
        '<div class="sub">JSON 有 caption，工作区无对应图片文件</div>' +
        '</div>' + cap + '</div>';
    }).join('');
  }

  /* 已知量 */
  var given = (a.situation && a.situation.given) || [];
  $('givens').innerHTML = given.map(function (g) {
    var unit = unitText(g.unit);
    var head;
    if (g.value == null || g.value === '') {
      head = esc(sym(g.symbol));
    } else {
      head = esc(sym(g.symbol)) + ' = ' + esc(num(g.value)) + esc(unit);
    }
    return '<div class="given"><span class="k">' + head + '</span>' +
      '<span class="v">' + esc(g.text || '') + '</span></div>';
  }).join('');

  /* 小问 */
  var sq = q.subquestions || [];
  $('subqs').innerHTML = sq.map(function (s) {
    return '<div class="subq"><span class="no">' + esc(s.no) + '</span>' +
      '<span>' + esc(s.text) + '</span>' +
      (s.score != null ? '<span class="sc">' + num(s.score) + ' 分</span>' : '') +
      '</div>';
  }).join('');
}

/* =========================================================================
   6. 渲染：作答纸
   ========================================================================= */
function crossHTML(stepId, part) {
  var j = hashAngle(stepId + '#' + part);
  return '<span class="cross" data-angle="' + j.toFixed(1) + '" data-seed="' +
    esc(stepId + '#' + part) + '"></span>';
}

function noteHTML(mark) {
  var code = mark.reason_code || '';
  var name = '';
  if (code) {
    for (var i = 0; i < ERRORS.length; i++) {
      if (ERRORS[i].code === code) { name = ERRORS[i].name; break; }
    }
  }
  var left = code ? ('<span class="code">' + esc(code) + '</span>' +
    (name ? '<span class="txt"> ' + esc(name) + '</span>' : '')) : '';
  var note = mark.note ? ('<span class="txt">' + esc(mark.note) + '</span>') : '';
  var body;
  if (left && note) body = left + '<span class="bar">｜</span>' + note;
  else if (left) body = left;
  else if (note) body = note;
  else body = '<span class="txt">已标记</span>';
  return '✗ ' + body;
}

function unitHTML(step, part, innerHTML, opts) {
  var uid = step.step_id + '#' + part;
  var mk = findMark(cur, step.step_id, part);
  var cls = 'unit' + (mk ? ' marked' : ' clickable') + (opts && opts.primary ? ' primary' : '');
  var rawLine = '';
  if (opts && opts.raw && needsRaw(opts.raw, opts.shown)) {
    rawLine = '<span class="raw">raw: ' + esc(opts.raw) + '</span>';
  }
  var cross = mk ? crossHTML(step.step_id, part) : '';
  var note = mk ? ('<span class="note">' + noteHTML(mk) + '</span>') : '';
  var cellCls = 'ucell' + (part === 'statement' ? ' wide' : '');
  return '<div class="' + cls + '" data-uid="' + esc(uid) + '" data-part="' + part +
    '" data-step="' + esc(step.step_id) + '">' +
    '<div class="urow"><span class="' + cellCls + '">' + innerHTML + cross + '</span>' +
    note + '</div>' + rawLine +
    '</div>';
}

function eqUnitHTML(step) {
  var p = prettify(step.equation && step.equation.sympy);
  if (!p) return '';
  var inner = '<span class="eq">' + esc(p.shown) + '</span>';
  return unitHTML(step, 'equation', inner, { raw: p.raw, shown: p.shown });
}

function stmtUnitHTML(step, primary) {
  if (!step.statement) return '';
  var inner = '<span class="stmt">' + esc(step.statement) + '</span>';
  return unitHTML(step, 'statement', inner, { primary: primary });
}

function valueHTML(step) {
  var v = step.value;
  if (!v) return '';
  var unit = unitText(v.unit);
  var dir = v.direction ? '<span class="dir">（方向 ' + esc(v.direction) + '）</span>' : '';
  var shown = '', tag = '';

  if (v.number != null && v.number !== '') {
    shown = num(v.number);
  } else if (v.exact) {
    var pe = renderValueExpr(v.exact);
    if (!pe) return '';
    shown = pe.shown;
    tag = '<span class="tag-sym" title="JSON: ' + esc(pe.raw) + '">符号解</span>';
  } else {
    return '';
  }

  return '<div class="step-value"><span class="arrow">⇒</span>' +
    esc(sym(v.symbol)) + ' = ' + esc(shown) + esc(unit) + dir + tag + '</div>';
}

function checksHTML(step) {
  var cs = step.checks || [];
  if (!cs.length) return '';
  return '<span class="checks">' + cs.map(function (c) {
    return '<span class="chk chk-' + esc(c.status) + '" title="' +
      esc(c.layer + ' · ' + c.status + (c.detail ? ' · ' + c.detail : '')) + '">' +
      esc(c.layer) + '</span>';
  }).join('') + '</span>';
}

function renderPaper(a) {
  var steps = a.steps || [];
  var head = '<div class="paper-head">' +
    '<span class="h">作　答　纸</span>' +
    '<span class="note">金标参考解 · 共 ' + steps.length + ' 步 · 点式子就地打叉</span>' +
    '</div>';

  var body = steps.map(function (s) {
    var noEq = !s.equation;
    return '<div class="step">' +
      '<span class="step-no">' + pad2(s.step_no) + '</span>' +
      '<div class="step-title">' + esc(s.title || '') + checksHTML(s) + '</div>' +
      stmtUnitHTML(s, noEq) +
      eqUnitHTML(s) +
      valueHTML(s) +
      '</div>';
  }).join('');

  $('sheet').innerHTML = head + (body || '<div class="empty">这道题没有步骤。</div>');
}

/* =========================================================================
   7. 红叉绘制：按实际盒子尺寸算对角线，两笔各偏 jitter
   ========================================================================= */
function drawCross(el) {
  var wrap = el.parentNode;          /* .ucell */
  if (!wrap) return;
  var w = wrap.offsetWidth;
  var h = wrap.offsetHeight;
  if (w < 4 || h < 4) return;

  var jitter = parseFloat(el.getAttribute('data-angle') || '0') || 0;

  /* 纯按对角线算，宽式子会压成一条横线。这里留角度下限，
     保证两笔始终看得出交叉，同时长度按水平投影覆盖整条式子。 */
  var base = Math.atan2(h, w) * 180 / Math.PI;
  var ang = Math.max(8, Math.min(24, base * 1.6));
  var rad = ang * Math.PI / 180;
  var len = (w + 16) / Math.cos(rad);

  var html = '';
  var angles = [ang + jitter, -ang + jitter];
  for (var i = 0; i < 2; i++) {
    html += '<i style="width:' + len.toFixed(1) + 'px;' +
      'margin-left:' + (-len / 2).toFixed(1) + 'px;' +
      'transform:rotate(' + angles[i].toFixed(2) + 'deg)"></i>';
  }
  el.innerHTML = html;
}

function drawAllCrosses() {
  var list = document.querySelectorAll('.cross');
  for (var i = 0; i < list.length; i++) drawCross(list[i]);
}

/* =========================================================================
   8. 批改槽 / 擦除条
   ========================================================================= */
function closeSlots() {
  var s = document.querySelectorAll('.slot, .erase-bar');
  for (var i = 0; i < s.length; i++) s[i].parentNode.removeChild(s[i]);
  openUid = null;
  eraseUid = null;
}

function errorOptions(selected) {
  var out = '<option value="">— 原因码（可留空）—</option>';
  for (var i = 0; i < ERRORS.length; i++) {
    var e = ERRORS[i];
    out += '<option value="' + esc(e.code) + '"' + (e.code === selected ? ' selected' : '') + '>' +
      esc(e.code + ' ' + (e.name || '')) +
      (e.layer ? '（' + esc(e.layer) + '）' : '') + '</option>';
  }
  return out;
}

function openSlot(unit) {
  closeSlots();
  var uid = unit.getAttribute('data-uid');
  var stepId = unit.getAttribute('data-step');
  var part = unit.getAttribute('data-part');
  var mk = findMark(cur, stepId, part);

  var slot = document.createElement('div');
  slot.className = 'slot';
  slot.innerHTML =
    '<span class="lb">原因码</span>' +
    '<select class="slot-code">' + errorOptions(mk ? mk.reason_code : '') + '</select>' +
    '<input class="slot-note note-in" type="text" placeholder="批注（可留空）" value="' +
      esc(mk ? (mk.note || '') : '') + '">' +
    '<button class="btn btn-sm btn-primary slot-ok">打叉</button>' +
    '<button class="btn btn-sm slot-cancel">取消</button>';

  unit.parentNode.insertBefore(slot, unit.nextSibling);
  openUid = uid;

  var sel = slot.querySelector('.slot-code');
  var inp = slot.querySelector('.slot-note');
  var ok = slot.querySelector('.slot-ok');

  function commit() {
    var code = sel.value || '';
    var note = (inp.value || '').trim();
    var arr = loadMarks(cur).filter(function (x) {
      return !(x.step_id === stepId && x.part === part);
    });
    arr.push({
      step_id: stepId,
      part: part,
      reason_code: code,
      note: note,
      at: nowISO()
    });
    saveMarks(cur, arr);
    closeSlots();
    renderPaper(ANSWERS[cur]);
    drawAllCrosses();
    updateCount();
  }

  ok.addEventListener('click', commit);
  slot.querySelector('.slot-cancel').addEventListener('click', closeSlots);
  sel.addEventListener('keydown', function (e) { if (e.key === 'Enter') commit(); });
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') commit(); });
  setTimeout(function () { sel.focus(); }, 0);
}

function openErase(unit) {
  closeSlots();
  var stepId = unit.getAttribute('data-step');
  var part = unit.getAttribute('data-part');
  var mk = findMark(cur, stepId, part);

  var bar = document.createElement('div');
  bar.className = 'erase-bar';
  bar.innerHTML =
    '<button class="erase">擦掉这笔</button>' +
    '<span class="meta">' + esc(mk ? (mk.reason_code || '无原因码') : '') +
    (mk && mk.note ? ' · ' + esc(mk.note) : '') + '</span>';

  unit.parentNode.insertBefore(bar, unit.nextSibling);
  eraseUid = unit.getAttribute('data-uid');

  bar.querySelector('.erase').addEventListener('click', function () {
    var arr = loadMarks(cur).filter(function (x) {
      return !(x.step_id === stepId && x.part === part);
    });
    saveMarks(cur, arr);
    closeSlots();
    renderPaper(ANSWERS[cur]);
    drawAllCrosses();
    updateCount();
  });
}

/* =========================================================================
   9. 计数 / 导出
   ========================================================================= */
function updateCount() {
  var n = loadMarks(cur).length;
  $('count').innerHTML = '已批改 <b>' + n + '</b> 处';
}

function exportJSON() {
  var id = cur;
  var payload = { answer_id: id, marks: loadMarks(id) };
  var txt = JSON.stringify(payload, null, 2);
  var blob = new Blob([txt], { type: 'application/json;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '批改记录_' + id + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* =========================================================================
   10. 题目切换
   ========================================================================= */
function renderQList() {
  $('qlist').innerHTML = IDS.map(function (id) {
    var m = ANSWERS[id].meta || {};
    return '<button class="qitem' + (id === cur ? ' active' : '') + '" data-id="' + esc(id) + '">' +
      '<b>' + esc(id) + '</b>　' + esc((m.source || '') +
        (m.question_no != null ? ' 第' + m.question_no + '题' : '')) + '</button>';
  }).join('');
}

function switchTo(id) {
  if (!ANSWERS[id]) return;
  closeSlots();
  cur = id;
  renderQList();
  renderAll();
  $('qlist').hidden = true;
  if (window.matchMedia('(max-width:1100px)').matches) {
    $('main').classList.remove('drawer-open');
  }
}

function renderAll() {
  var a = ANSWERS[cur];
  if (!a) {
    $('sheet').innerHTML = '<div class="empty">没有数据。<br><br>' +
      '请在工作区运行 <code>python 原型/_build.py</code> 注入 7 份 answer JSON。</div>';
    $('qtitle').textContent = '—';
    $('score').textContent = '';
    $('layers').innerHTML = '';
    $('stem').innerHTML = '';
    $('figures').innerHTML = '';
    $('givens').innerHTML = '';
    $('subqs').innerHTML = '';
    updateCount();
    return;
  }
  renderTop(a);
  renderSidebar(a);
  renderPaper(a);
  drawAllCrosses();
  updateCount();
}

/* =========================================================================
   11. 事件
   ========================================================================= */
function bind() {
  /* 题目下拉 */
  $('qbtn').addEventListener('click', function (e) {
    e.stopPropagation();
    $('qlist').hidden = !$('qlist').hidden;
  });
  $('qlist').addEventListener('click', function (e) {
    var b = e.target.closest('.qitem');
    if (b) switchTo(b.getAttribute('data-id'));
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.qsel')) $('qlist').hidden = true;
  });

  /* 折叠 / 抽屉 */
  $('collapse').addEventListener('click', function () {
    if (window.matchMedia('(max-width:1100px)').matches) {
      $('main').classList.remove('drawer-open');
    } else {
      $('main').classList.add('collapsed');
    }
  });
  $('rail').addEventListener('click', function () {
    $('main').classList.remove('collapsed');
  });
  $('stem-btn').addEventListener('click', function () {
    $('main').classList.toggle('drawer-open');
  });
  window.addEventListener('resize', function () {
    if (!window.matchMedia('(max-width:1100px)').matches) {
      $('main').classList.remove('drawer-open');
    }
  });

  /* 作答纸点击：打叉 / 擦掉 */
  $('sheet').addEventListener('click', function (e) {
    if (e.target.closest('.slot') || e.target.closest('.erase-bar')) return;
    var unit = e.target.closest('.unit');
    if (!unit) { closeSlots(); return; }

    var uid = unit.getAttribute('data-uid');
    var part = unit.getAttribute('data-part');
    var stepId = unit.getAttribute('data-step');
    var mk = findMark(cur, stepId, part);

    if (mk) {
      if (eraseUid === uid) { closeSlots(); return; }
      openErase(unit);
    } else {
      if (openUid === uid) { closeSlots(); return; }
      openSlot(unit);
    }
  });

  /* 导出 */
  $('export-top').addEventListener('click', exportJSON);
  $('export-bottom').addEventListener('click', exportJSON);

  /* 盒子尺寸变化 → 重画叉 */
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () {
      window.requestAnimationFrame(drawAllCrosses);
    });
    ro.observe($('sheet'));
  }
}

/* =========================================================================
   12. 启动
   ========================================================================= */
renderQList();
renderAll();
bind();

})();
</script>
